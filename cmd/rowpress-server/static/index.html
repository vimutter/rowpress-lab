<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Turn a CSV file into a clean PDF report in seconds.">
  <title>Rowpress · CSV to PDF</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212f;
      --muted: #667085;
      --paper: #fffdf8;
      --line: #d9ded8;
      --accent: #e85d3f;
      --accent-dark: #c6422a;
      --teal: #176b68;
      --shadow: 0 24px 70px rgba(24, 33, 47, .14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 14%, rgba(232, 93, 63, .16), transparent 30rem),
        radial-gradient(circle at 88% 88%, rgba(23, 107, 104, .15), transparent 32rem),
        #f2f0e9;
    }
    main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; font-weight: 800; letter-spacing: -.03em; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; color: white; background: var(--teal); border-radius: 11px; transform: rotate(-3deg); }
    .shell { display: grid; grid-template-columns: .9fr 1.1fr; overflow: hidden; border: 1px solid rgba(24, 33, 47, .08); border-radius: 28px; background: var(--paper); box-shadow: var(--shadow); }
    .intro { position: relative; padding: 56px; color: white; background: var(--teal); }
    .intro::after { content: ""; position: absolute; right: -90px; bottom: -100px; width: 280px; height: 280px; border: 52px solid rgba(255,255,255,.08); border-radius: 50%; }
    .eyebrow { margin: 0 0 18px; color: #bde5dc; font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 8ch; margin: 0; font-family: Georgia, serif; font-size: clamp(3rem, 7vw, 5.7rem); font-weight: 500; line-height: .92; letter-spacing: -.06em; }
    .lede { max-width: 34rem; margin: 26px 0 0; color: #d9efea; font-size: 1.05rem; line-height: 1.65; }
    .privacy { display: flex; gap: 10px; align-items: center; margin-top: 42px; color: #bde5dc; font-size: .85rem; }
    .privacy svg { flex: 0 0 auto; }
    form { padding: 48px; }
    .field { margin-bottom: 22px; }
    label { display: block; margin-bottom: 8px; font-size: .86rem; font-weight: 750; }
    .hint { color: var(--muted); font-size: .76rem; font-weight: 500; }
    input, select, button { width: 100%; font: inherit; }
    input[type="text"], select, .file-control {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"], select { padding: 0 14px; color: var(--ink); }
    input:focus, select:focus, .file-control:focus-within { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(23, 107, 104, .12); }
    .file-control { position: relative; display: flex; align-items: center; padding: 9px 12px; }
    .file-control input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .file-pill { flex: 0 0 auto; padding: 6px 10px; border-radius: 8px; color: var(--teal); background: #e9f4f1; font-size: .78rem; font-weight: 800; }
    .file-name { min-width: 0; margin-left: 11px; overflow: hidden; color: var(--muted); font-size: .86rem; text-overflow: ellipsis; white-space: nowrap; }
    .row { display: grid; grid-template-columns: 1fr 150px; gap: 16px; }
    button { display: flex; justify-content: center; align-items: center; gap: 10px; min-height: 52px; margin-top: 30px; border: 0; border-radius: 13px; color: white; background: var(--accent); font-weight: 800; cursor: pointer; box-shadow: 0 9px 22px rgba(232, 93, 63, .22); transition: background .2s, transform .2s; }
    button:hover { background: var(--accent-dark); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .65; transform: none; }
    .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.4); border-top-color: white; border-radius: 50%; animation: spin .8s linear infinite; }
    button.busy .spinner { display: block; }
    .connection { display: flex; align-items: center; gap: 8px; margin: -4px 0 22px; color: var(--muted); font-size: .8rem; font-weight: 650; }
    .connection-dot { width: 9px; height: 9px; border-radius: 50%; background: #d0d5dd; box-shadow: 0 0 0 4px rgba(208, 213, 221, .25); }
    .connection.online .connection-dot { background: #12b76a; box-shadow: 0 0 0 4px rgba(18, 183, 106, .14); }
    .connection.offline .connection-dot { background: #f04438; box-shadow: 0 0 0 4px rgba(240, 68, 56, .13); }
    .status { min-height: 22px; margin: 14px 0 0; color: var(--muted); font-size: .84rem; text-align: center; }
    .status.error { color: #b42318; }
    .status.success { color: var(--teal); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 800px) {
      main { padding: 24px 0; }
      .shell { grid-template-columns: 1fr; }
      .intro, form { padding: 34px 28px; }
      h1 { max-width: 10ch; font-size: 3.5rem; }
      .privacy { margin-top: 28px; }
    }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark">R</span><span>rowpress</span></div>
    <section class="shell">
      <div class="intro">
        <p class="eyebrow">CSV → polished PDF</p>
        <h1>Your rows, ready to present.</h1>
        <p class="lede">Select a CSV, optionally add your logo, and download a clean table report. No templates to wrestle with.</p>
        <p class="privacy">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
          Files are processed in memory and never stored.
        </p>
      </div>

      <form id="converter">
        <div id="connection" class="connection"><span class="connection-dot"></span><span class="connection-label">Connecting…</span></div>
        <div class="field">
          <label for="csv">CSV file</label>
          <div class="file-control">
            <input id="csv" type="file" accept=".csv,text/csv" required>
            <span class="file-pill">Choose CSV</span>
            <span class="file-name" data-for="csv">No file selected</span>
          </div>
        </div>

        <div class="field">
          <label for="logo">Logo <span class="hint">optional · PNG, JPEG or GIF</span></label>
          <div class="file-control">
            <input id="logo" type="file" accept="image/png,image/jpeg,image/gif">
            <span class="file-pill">Choose logo</span>
            <span class="file-name" data-for="logo">No file selected</span>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="title">Report title</label>
            <input id="title" type="text" maxlength="200" placeholder="CSV export">
          </div>
          <div class="field">
            <label for="delimiter">Delimiter</label>
            <select id="delimiter">
              <option value=",">Comma</option>
              <option value=";">Semicolon</option>
              <option value="&#9;">Tab</option>
              <option value="|">Pipe</option>
            </select>
          </div>
        </div>

        <button id="submit" type="submit" disabled><span class="spinner" aria-hidden="true"></span><span class="button-label">Create PDF</span></button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const form = document.querySelector('#converter');
    const csvInput = document.querySelector('#csv');
    const logoInput = document.querySelector('#logo');
    const button = document.querySelector('#submit');
    const buttonLabel = button.querySelector('.button-label');
    const status = document.querySelector('#status');
    const connectionState = document.querySelector('#connection');
    const connectionLabel = connectionState.querySelector('.connection-label');
    let socket;
    let connected = false;
    let activeJob = null;
    let reconnectTimer;

    for (const input of [csvInput, logoInput]) {
      input.addEventListener('change', () => {
        document.querySelector(`[data-for="${input.id}"]`).textContent = input.files[0]?.name || 'No file selected';
        updateButton();
      });
    }

    function setStatus(message, kind = '') {
      status.textContent = message;
      status.className = `status ${kind}`;
    }

    function setConnection(message, kind = '') {
      connectionLabel.textContent = message;
      connectionState.className = `connection ${kind}`;
    }

    function updateButton() {
      button.disabled = !connected || !csvInput.files[0] || activeJob !== null;
    }

    function setBusy(busy) {
      button.classList.toggle('busy', busy);
      buttonLabel.textContent = busy ? 'Creating PDF…' : 'Create PDF';
      updateButton();
    }

    function readDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(`Could not read ${file.name}`));
        reader.readAsDataURL(file);
      });
    }

    function downloadPDF(data, sourceName) {
      const blob = new Blob([data], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = sourceName.replace(/\.csv$/i, '') + '.pdf';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function finishJob() {
      activeJob = null;
      setBusy(false);
    }

    function connect() {
      clearTimeout(reconnectTimer);
      setConnection('Connecting…');
      connected = false;
      updateButton();
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/ws`);
      socket.binaryType = 'arraybuffer';

      socket.onmessage = (event) => {
        if (typeof event.data !== 'string') {
          if (!activeJob) return;
          downloadPDF(event.data, activeJob.fileName);
          setStatus('PDF downloaded. Choose another CSV or create it again.', 'success');
          finishJob();
          return;
        }

        let message;
        try { message = JSON.parse(event.data); }
        catch { return setStatus('Server returned an unreadable message.', 'error'); }
        if (message.type === 'ready') {
          connected = true;
          setConnection('Connected', 'online');
          setStatus('Ready for your CSV.');
          updateButton();
        } else if (message.type === 'status' && activeJob?.id === message.id) {
          setStatus(message.message);
        } else if (message.type === 'error' && (!message.id || activeJob?.id === message.id)) {
          setStatus(message.error || 'Conversion failed.', 'error');
          finishJob();
        }
      };

      socket.onclose = () => {
        connected = false;
        setConnection('Disconnected · retrying…', 'offline');
        if (activeJob) {
          setStatus('Connection closed during conversion. Please try again.', 'error');
          finishJob();
        }
        updateButton();
        reconnectTimer = setTimeout(connect, 1500);
      };
      socket.onerror = () => socket.close();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const csvFile = csvInput.files[0];
      const logoFile = logoInput.files[0];
      if (!csvFile || !connected || activeJob) return;
      if (csvFile.size > 10 * 1024 * 1024) return setStatus('CSV must be 10 MiB or smaller.', 'error');
      if (logoFile && logoFile.size > 5 * 1024 * 1024) return setStatus('Logo must be 5 MiB or smaller.', 'error');

      const id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
      activeJob = { id, fileName: csvFile.name };
      setBusy(true);
      setStatus('Reading your files…');

      try {
        const [csv, logo] = await Promise.all([
          csvFile.text(),
          logoFile ? readDataURL(logoFile) : Promise.resolve('')
        ]);
        socket.send(JSON.stringify({
          type: 'convert',
          id,
          title: document.querySelector('#title').value,
          delimiter: document.querySelector('#delimiter').value,
          csv,
          logo_base64: logo
        }));
      } catch (error) {
        setStatus(error.message || 'Could not read the selected files.', 'error');
        finishJob();
      }
    });

    window.addEventListener('beforeunload', () => {
      clearTimeout(reconnectTimer);
      socket?.close(1000, 'page closed');
    });
    connect();
  </script>
</body>
</html>
